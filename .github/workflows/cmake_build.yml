name: C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Cross-platform Release build + tests
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run Tests
        run: ./build/test_queue

  # 2. Sanitizer builds (Linux only)
  sanitizers:
    name: Sanitizer (${{ matrix.sanitizer.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - name: tsan
            flags: "-fsanitize=thread -fno-omit-frame-pointer -g -O1"
          - name: asan-ubsan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1"
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="${{ matrix.sanitizer.flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.sanitizer.flags }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Run Tests
        env:
          TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1"
          ASAN_OPTIONS: "halt_on_error=1 detect_leaks=1 abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1 print_stacktrace=1"
        run: ./build/test_queue